[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "contadb-sdk"
dynamic = ["version"]
description = "Python SDK para construir, firmar y timbrar CFDI 4.0 contra el API de ContaDB"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "AOSystems", email = "soporte@contadb.mx" },
]
keywords = [
    "cfdi",
    "cfdi40",
    "sat",
    "facturacion",
    "mexico",
    "timbrado",
    "contadb",
    "pac",
    "invoice",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "cryptography>=42,<46",
    "lxml>=5,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-httpx>=0.30",
    "mypy>=1.10",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://contadb.mx"
Documentation = "https://github.com/aosystems/contadb-sdk#readme"
Repository = "https://github.com/aosystems/contadb-sdk"
Issues = "https://github.com/aosystems/contadb-sdk/issues"
Changelog = "https://github.com/aosystems/contadb-sdk/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/contadb_sdk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/contadb_sdk"]

[tool.hatch.build.targets.wheel.force-include]
"src/contadb_sdk/_xslt/cadenaoriginal_4_0.xslt" = "contadb_sdk/_xslt/cadenaoriginal_4_0.xslt"
"src/contadb_sdk/_xslt/utilerias.xslt" = "contadb_sdk/_xslt/utilerias.xslt"
"src/contadb_sdk/_xslt/Pagos20.xslt" = "contadb_sdk/_xslt/Pagos20.xslt"
"src/contadb_sdk/_xslt/CartaPorte31.xslt" = "contadb_sdk/_xslt/CartaPorte31.xslt"
"src/contadb_sdk/complementos/carta_porte/catalogos/_datos/tipo_permiso.json" = "contadb_sdk/complementos/carta_porte/catalogos/_datos/tipo_permiso.json"
"src/contadb_sdk/complementos/carta_porte/catalogos/_datos/config_autotransporte.json" = "contadb_sdk/complementos/carta_porte/catalogos/_datos/config_autotransporte.json"
"src/contadb_sdk/complementos/carta_porte/catalogos/_datos/tipo_figura.json" = "contadb_sdk/complementos/carta_porte/catalogos/_datos/tipo_figura.json"
"src/contadb_sdk/complementos/carta_porte/catalogos/_datos/pais.json" = "contadb_sdk/complementos/carta_porte/catalogos/_datos/pais.json"
"src/contadb_sdk/py.typed" = "contadb_sdk/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long — formatter handles
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["contadb_sdk"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["src/contadb_sdk"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
